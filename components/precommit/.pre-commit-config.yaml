# .pre-commit-config.yaml — superset configuration
#
# HOW STAGES WORK:
#   🚀 commit     → fires on `git commit`          → .git/hooks/pre-commit
#   💬 commit-msg → fires after typing the message → .git/hooks/commit-msg
#   🔬 push       → fires on `git push`            → .git/hooks/pre-push
#
#   Hooks with no `stages:` key default to the commit stage.
#
# INSTALL (run once per repo):
#   pre-commit install \
#     --hook-type pre-commit \
#     --hook-type commit-msg \
#     --hook-type pre-push
#
# UPDATE all pinned versions:
#   pre-commit autoupdate
#
# Run a stage manually:
#   pre-commit run --all-files                          # commit stage
#   pre-commit run --hook-stage push --all-files        # push stage
#   pre-commit run --hook-stage commit-msg              # commit-msg stage
#
# Skip a hook for one commit/push:
#   SKIP=semgrep git push

# ══════════════════════════════════════════════════════════════════════════════
# 🚀 STAGE: commit  —  fast checks, run on every git commit
# ══════════════════════════════════════════════════════════════════════════════

repos:

  # ── 🧹 Cache & temp file cleanup ──────────────────────────────────────────
  - repo: local
    hooks:
      - id: clean-cache-files
        name: "🧹 Cleanup · Remove cache and temporary files"
        entry: bash -c
        args:
          - |
            echo "Cleaning cache and temporary files..."
            find . -name ".venv" -prune -o -type d -name "__pycache__" -exec rm -rf {} +
            find . -name ".venv" -prune -o -type f -name ".DS_Store" -exec rm -f {} +
            find . -name ".venv" -prune -o -type d -name "catboost_info" -exec rm -rf {} +
            find . -name ".venv" -prune -o -type d -name ".ruff_cache" -exec rm -rf {} +
            find . -name ".venv" -prune -o -type d -name ".ipynb_checkpoints" -exec rm -rf {} +
            find . -name ".venv" -prune -o -type d -name "*.egg-info" -exec rm -rf {} +
            echo "Cache cleanup completed."
        language: system
        always_run: true
        pass_filenames: false

  # ── 🔒 uv lockfile consistency ────────────────────────────────────────────
  # Only runs when pyproject.toml or uv.lock are staged.
  # Catches the common mistake of editing pyproject.toml without running uv lock.
  - repo: local
    hooks:
      - id: uv-lock-check
        name: "🔒 uv · Verify lockfile is consistent with pyproject.toml"
        language: system
        entry: uv lock --locked
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock)$

  # ── 📁 File hygiene ────────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: "v5.0.0"
    hooks:
      - id: trailing-whitespace
        name: "📁 Files · Remove trailing whitespace"
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
        name: "📁 Files · Ensure files end with a newline"
      - id: check-added-large-files
        name: "📁 Files · Block files larger than 500 KB"
        args: ['--maxkb=500']  # Adjust per project; use Git LFS for large binary assets.
      - id: mixed-line-ending
        name: "📁 Files · Normalise mixed line endings"
        args: [--fix=auto]
      - id: check-case-conflict
        name: "📁 Files · Detect filename case conflicts"
      - id: check-merge-conflict
        name: "📁 Git  · Catch unresolved merge conflict markers"
      - id: check-executables-have-shebangs
        name: "📁 Scripts · Verify executable files have shebangs"
      - id: check-shebang-scripts-are-executable
        name: "📁 Scripts · Verify shebang scripts are executable"
      - id: debug-statements
        name: "📁 Python · Catch stray breakpoint() / pdb imports"
      - id: check-docstring-first
        name: "📁 Python · Verify docstrings appear before code"
      - id: check-yaml
        name: "📁 YAML  · Validate syntax"
      - id: check-toml
        name: "📁 TOML  · Validate syntax"
      - id: check-json
        name: "📁 JSON  · Validate syntax"
        exclude: \.ipynb$
      - id: pretty-format-json
        name: "📁 JSON  · Autoformat JSON files"
        exclude: \.ipynb$
        args: [--autofix, --no-sort-keys, --indent=2]
      - id: check-xml
        name: "📁 XML   · Validate syntax"

  # ── 🐍 Python: lint and format (ruff) ─────────────────────────────────────
  # Keep in sync with ruff version in pyproject.toml [dependency-groups.dev].
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "v0.9.6"
    hooks:
      - id: ruff-check
        name: "🐍 Python · Lint and auto-fix code (ruff)"
        args:
          [
            --fix,
            --exit-non-zero-on-fix,
            --config=pyproject.toml,
            --output-format=concise,
          ]
      - id: ruff-format
        name: "🐍 Python · Format code (ruff)"
        args: [--config=pyproject.toml]
      - id: ruff-check
        name: "📓 Jupyter · Lint notebooks (ruff)"
        args: [--fix]
        files: \.ipynb$

  # ── 📓 Jupyter: strip notebook outputs ────────────────────────────────────
  # Strips cell outputs and execution counts before commit to keep diffs clean.
  # Remove or comment out if the project does not contain .ipynb files.
  - repo: https://github.com/kynan/nbstripout
    rev: 0.7.1
    hooks:
      - id: nbstripout
        name: "📓 Jupyter · Strip notebook outputs (nbstripout)"

  # ── 📚 Python: docstring coverage ──────────────────────────────────────────
  - repo: https://github.com/econchick/interrogate
    rev: 1.7.0
    hooks:
      - id: interrogate
        name: "📚 Python · Check docstring coverage (interrogate)"
        args: [--config=pyproject.toml, -vv, '--fail-under=80']  # Lower for early-stage; raise as API stabilises.
        files: \.py$
        types: [python]

  # ── 📖 Markdown: lint and format ───────────────────────────────────────────
  # Requires Node.js (any LTS). Installed automatically by pre-commit via the node language handler.
  # If pre-commit fails to install: ensure nvm or a system node is available.
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.17.2
    hooks:
      - id: markdownlint-cli2
        name: "📖 Markdown · Lint and fix markdown (markdownlint-cli2)"
        args: [--fix]
        types: [markdown]

  # ── 🔤 Typo detection ──────────────────────────────────────────────────────
  - repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
      - id: codespell
        name: "🔤 Prose · Detect and fix typos (codespell)"
        additional_dependencies: [tomli]
        args: [--write-changes]  # Auto-corrects typos in-place; modified files are re-staged automatically.
        # To ignore specific words: args: [--write-changes, --ignore-words-list, "word1,word2"]

  # ── 🔒 Secret scanning ─────────────────────────────────────────────────────
  # Requires gitleaks installed on the host:
  #   macOS:  brew install gitleaks
  #   Linux:  https://github.com/gitleaks/gitleaks#installing
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.28.0
    hooks:
      - id: gitleaks
        name: "🔒 Security · Scan for secrets and credentials (gitleaks)"
        args: ["--report-format=table", "--redact"]

  # ── 📦 Dependency analysis ─────────────────────────────────────────────────
  # DEP001 = missing dep, DEP002 = unused dep, DEP003 = transitive, DEP004 = dev-only in production
  # DEP002 (unused dependency) is ignored — too many false positives from optional/conditional imports.
  # DEP001/DEP003/DEP004 are enforced to catch missing, transitive, and misplaced dependencies.
  - repo: https://github.com/fpgmaas/deptry
    rev: "0.20.0"
    hooks:
      - id: deptry
        name: "📦 Python · Analyse dependencies (deptry)"
        args: ["--ignore", "DEP002"]

  # ── 🗄️ SQL: lint and format ────────────────────────────────────────────────
  # Remove or comment out if the project does not contain SQL files.
  # Set --dialect to match your database engine (ansi, postgres, mysql, bigquery, snowflake, …).
  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 3.3.0
    hooks:
      - id: sqlfluff-lint
        name: "🗄️  SQL · Lint SQL files (sqlfluff)"
      - id: sqlfluff-fix
        name: "🗄️  SQL · Fix SQL files (sqlfluff)"
        args: [--dialect, ansi]

# ══════════════════════════════════════════════════════════════════════════════
# 💬 STAGE: commit-msg  —  validates the commit message text
# ══════════════════════════════════════════════════════════════════════════════

  # ── Conventional Commits format enforcement ────────────────────────────────
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.4.0
    hooks:
      - id: conventional-pre-commit
        name: "💬 Git · Enforce Conventional Commits format"
        stages: [commit-msg]
        args: [feat, fix, docs, style, refactor, test, chore, ci, build, perf, revert]

# ══════════════════════════════════════════════════════════════════════════════
# 🔬 STAGE: push  —  deep checks, run only on git push
# ══════════════════════════════════════════════════════════════════════════════

  # ── 🔍 Static type checking ────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.0
    hooks:
      - id: mypy
        name: "🔍 Python · Static type checking (mypy)"
        stages: [push]
        additional_dependencies: []
        # Add type stubs as your project grows, e.g.:
        # additional_dependencies: [types-requests, types-PyYAML]

  # ── 🛡️ Advanced security analysis ─────────────────────────────────────────
  # --config=p/python uses a pinned Semgrep rule set (avoids runtime rule downloads with --config=auto).
  # Requires network. To skip offline: SKIP=semgrep git push
  - repo: https://github.com/semgrep/semgrep
    rev: v1.95.0
    hooks:
      - id: semgrep
        name: "🛡️  Security · Advanced static analysis (semgrep)"
        stages: [push]
        args: [--config=p/python, --error]

  # ── 🐳 Infrastructure / config security scan ──────────────────────────────
  # Requires trivy installed on the host:
  #   macOS:  brew install trivy
  #   Linux:  https://aquasecurity.github.io/trivy/latest/getting-started/installation/
  # Consider CI-only deployment if contributors may not have trivy locally.
  - repo: local
    hooks:
      - id: trivy-config
        name: "🐳 Security · Scan IaC and config files (trivy)"
        entry: trivy config --exit-code 1 --severity HIGH,CRITICAL .
        language: system
        pass_filenames: false
        stages: [push]
