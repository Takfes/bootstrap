site_name: "{{project_name}}"
repo_url: "https://github.com/{{github_org}}/{{repo_name}}"
site_url: "https://{{github_org}}.github.io/{{repo_name}}"
site_description: "{{description}}"
site_author: "{{author}}"
docs_dir: mkdocs-pages  # kept separate from docs/, which holds bootstrap's own component reference docs
edit_uri: edit/main/mkdocs-pages/  # Change 'main' if your default branch has a different name
repo_name: "{{github_org}}/{{repo_name}}"
copyright: 'Maintained by <a href="https://github.com/{{github_org}}">{{author}}</a>.'

nav:
  - Home: index.md
  - API Reference: api.md
  - Changelog: changelog.md

plugins:
  - search
  - git-revision-date-localized:
      enable_creation_date: true
  - mkdocstrings:
      handlers:
        python:
          paths: ["{{package_src_path}}"]

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

extra:
  social:
    - icon: fontawesome/brands/github
      link: "https://github.com/{{github_org}}/{{repo_name}}"
    - icon: fontawesome/brands/python
      link: "https://pypi.org/project/{{repo_name}}"

markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - attr_list
  - md_in_html
