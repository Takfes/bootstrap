# Bootstrap component registry.
# This file is the source of truth for all available template components.
# Adding a new component: create components/<name>/ and add an entry here.
#
# context_vars declares which interactively-prompted template variables a
# component's files reference (e.g. {{license_type}}, {{agent_name}}). It does
# NOT include project_name/package_name/repo_name/year/author, which are
# always available with a derived or default value and never gated behind
# component selection (author defaults to a placeholder — see cli.py).
# The CLI prompts only for the union of context_vars across selected
# components — see _needed_context_vars() in src/bootstrap/cli.py.

[[components]]
name = "uv"
description = "uv dependency management + pyproject.toml with all tool configs (ruff, mypy, deptry, pytest, coverage)"
repo_path = "components/ultraviolet"
requires = []
context_vars = ["github_org", "description", "python_version", "license_type", "coverage_threshold"]
optional = false

[[components]]
name = "precommit"
description = "pre-commit hooks (ruff-format, ruff-check, mypy, gitleaks, semgrep, conventional commits)"
repo_path = "components/precommit"
requires = ["uv"]
context_vars = ["coverage_threshold"]
optional = false

[[components]]
name = "agent-config"
description = "AI agent configuration: CLAUDE.md, behavioural rules, memory workflows"
repo_path = "components/agent-config"
requires = []
context_vars = ["agent_name"]
optional = true

[[components]]
name = "license"
description = "Project license file — choose from MIT, Apache 2.0, BSD 3-Clause, ISC, or GPL v3"
repo_path = "components/license"
requires = []
context_vars = ["license_type"]
optional = true

[[components]]
name = "justfile"
description = "just task runner — cross-platform commands for install, lint, test, build, docs, and more"
repo_path = "components/justfile"
requires = []
context_vars = []
optional = true

[[components]]
name = "makefile"
description = "GNU Make task runner — self-documenting Makefile for install, lint, test, build, docs, and more"
repo_path = "components/makefile"
requires = []
context_vars = []
optional = true

[[components]]
name = "devcontainer"
description = "VSCode DevContainer: reproducible environment with Python, Kubernetes tools (kubectl, k9s, devspace, mirrord), MCP servers, and pre-configured shell aliases"
repo_path = "components/devcontainer"
requires = []
context_vars = []
optional = true

[[components]]
name = "mkdocs"
description = "MkDocs + Material theme documentation site — dark/light mode, mkdocstrings API docs, git-revision-date"
repo_path = "components/mkdocs"
requires = ["uv"]
context_vars = ["github_org", "description"]
optional = true
