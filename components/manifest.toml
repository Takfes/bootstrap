# Bootstrap component registry.
# This file is the source of truth for all available template components.
# Adding a new component: create components/<name>/ and add an entry here.

[[components]]
name = "uv"
description = "uv dependency management + pyproject.toml with all tool configs (ruff, mypy, deptry, pytest, coverage)"
repo_path = "components/uv"
requires = []
optional = false

[[components]]
name = "precommit"
description = "pre-commit hooks (ruff-format, ruff-check, mypy, gitleaks, semgrep, conventional commits)"
repo_path = "components/precommit"
requires = ["uv"]
optional = false

[[components]]
name = "agents[configuration]"
description = "AI agent configuration: Claude, rules, CLAUDE.MD etc"
repo_path = "components/agent-configuration"
requires = []
optional = true

[[components]]
name = "agents[subagents]"
description = "AI Agent/Subagent Profiles: Python Pro, Business Analyst etc"
repo_path = "components/agents-subagents"
requires = []
optional = true

[[components]]
name = "agents[skills-commands]"
description = "AI Agent Skills/Commands: planning, web search etc"
repo_path = "components/agents-skills-commands"
requires = []
optional = true
