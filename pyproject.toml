[project]
name = "bootstrap"
version = "0.1.0"
description = "Portable Python project scaffolding CLI"
authors = [{ name = "Takis Fessas", email = "pan.fessas@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = []   # zero runtime dependencies — pure stdlib

[project.optional-dependencies]
tui = ["textual>=0.80.0"]

[project.scripts]
bootstrap = "bootstrap.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bootstrap"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["bootstrap"]
